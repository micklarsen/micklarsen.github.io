{% extends "hook/templates/page.html" %}

{% block content %}
{{ super() }}
<dialog id="img-lightbox">
  <img alt="Enlarged image">
</dialog>
<script>
  (function() {
    var d = document.getElementById('img-lightbox');
    document.querySelectorAll('main img').forEach(function(img) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function() {
        d.querySelector('img').src = img.src;
        d.showModal();
      });
    });
    d.addEventListener('click', function() { d.close(); });
  })();
</script>
{% endblock content %}
